plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.medsource.gamoterp.posdisplay'
version = '0.1.0'

android {
  namespace "com.medsource.gamoterp.posdisplay"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // ReactFontManager — reuses the Poppins typefaces expo-font registered from JS (falls back to sans-serif).
  implementation 'com.facebook.react:react-android'
}
