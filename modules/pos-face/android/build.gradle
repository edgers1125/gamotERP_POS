plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.medsource.gamoterp.posface'
version = '0.1.0'

android {
  namespace "com.medsource.gamoterp.posface"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // CameraX — the same version expo-camera 57 already ships (no second copy in the APK).
  def camerax_version = "1.6.0"
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  // ML Kit face detection, BUNDLED model (~6.9 MB): works offline from the first launch and without Google Play
  // services. Keep in step with FACE_ENGINE in PosFaceModule.kt (sent as liveness.engine). The unbundled alternative
  // (com.google.android.gms:play-services-mlkit-face-detection, ~0.8 MB) downloads its model through Play services.
  implementation 'com.google.mlkit:face-detection:16.1.7'
}
